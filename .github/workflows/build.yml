name: Build MissionControl

on:
  push:
    branches:
      - stadia-ble
      - master
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run host C++ regression tests
        run: make -C tests test

  build-switch:
    needs: host-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository with full history and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git safe.directory and build tools
        run: |
          git config --global --add safe.directory '*'
          if ! command -v zip >/dev/null 2>&1; then
            apt-get update && apt-get install -y zip
          fi

      - name: Build MissionControl dist package
        run: |
          source /etc/profile.d/devkit-env.sh 2>/dev/null || true
          make -j$(nproc) dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: missioncontrol-stadia-ble
          path: |
            dist/MissionControl-*.zip
            dist/atmosphere/contents/010000000000bd00/exefs.nsp
